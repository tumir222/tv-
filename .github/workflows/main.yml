name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.7 }
      - name: Arrange files
        run: |
          set -e
          D=app/src/main/java/sa/tv/launcher
          mkdir -p $D app/src/main/res/font app/src/main/res/drawable-nodpi
          printf "plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }\nandroid {\n    namespace 'sa.tv.launcher'\n    compileSdk 34\n    defaultConfig { applicationId \"sa.tv.launcher\"; minSdk 26; targetSdk 34; versionCode 2; versionName \"2.0\" }\n    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }\n    kotlinOptions { jvmTarget = '17' }\n}\n" > app/build.gradle
          printf "plugins {\n    id 'com.android.application' version '8.5.2' apply false\n    id 'org.jetbrains.kotlin.android' version '1.9.24' apply false\n}\n" > build.gradle
          rm -f $D/*.kt
          for f in *.kt; do [ -f "$f" ] && mv -f "$f" $D/; done
          for f in *.otf; do [ -f "$f" ] && mv -f "$f" app/src/main/res/font/; done
          for f in wall*.jpg; do [ -f "$f" ] && mv -f "$f" app/src/main/res/drawable-nodpi/; done
          [ -f AndroidManifest.xml ] && mv -f AndroidManifest.xml app/src/main/AndroidManifest.xml
          grep -n versionName app/build.gradle
          find app -type f | sort
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: TvLauncher-apk, path: app/build/outputs/apk/debug/app-debug.apk }
